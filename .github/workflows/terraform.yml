name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger: Actions > Terraform > Run workflow (on main).
  #   plan    - plan only
  #   apply   - plan, then apply after approval (e.g. to retry a rejected run)
  #   destroy - destroy plan, then destroy after approval; needs confirm=destroy
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: 'Type "destroy" to confirm a destroy'
        type: string
        required: false
        default: ""

permissions:
  id-token: write # needed for AWS OIDC login
  contents: read

# Only one Terraform run at a time - the S3 backend has no state locking yet
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.5.7
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  # Folder holding the Terraform stack this workflow plans and applies
  TF_DIR: .
  # Empty on push / pull_request, so those always do a normal plan
  TF_ACTION: ${{ inputs.action }}

defaults:
  run:
    shell: bash # runs with -eo pipefail, so a failed plan isn't hidden by tee
    working-directory: . # keep in sync with TF_DIR

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Confirm destroy
        if: inputs.action == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Destroy not confirmed::To destroy, set the confirm input to exactly: destroy"
            exit 1
          fi
          echo "::warning title=Destroy requested::This run will plan the DESTRUCTION of every resource in the stack."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check AWS role secret is set
        env:
          ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing secret::AWS_PLAN_ROLE_ARN secret is not set. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          if [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -no-color -out=tfplan | tee plan.txt
          else
            terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          fi

      - name: Add plan to job summary
        if: always()
        run: |
          {
            if [ "$TF_ACTION" = "destroy" ]; then
              echo "### :warning: Terraform DESTROY plan"
            else
              echo "### Terraform plan"
            fi
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo "No plan output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    # Runs after every merge to main, or a manual run with action apply/destroy,
    # then waits for a required reviewer to approve the "dev" environment.
    # A destroy run applies the saved destroy plan, so it deletes everything.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.action == 'apply' || inputs.action == 'destroy')))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check AWS role secret is set
        env:
          ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing secret::AWS_APPLY_ROLE_ARN secret is not set. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply (${{ inputs.action == 'destroy' && 'destroy' || 'apply' }})
        run: terraform apply -input=false -no-color tfplan
