name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger: Actions > Terraform > Run workflow (on main).
  #   plan    - plan only
  #   apply   - plan, then apply after approval (e.g. to retry a rejected run)
  #   destroy - destroy plan, then destroy after approval; needs confirm=destroy
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      team:
        description: "Which team stack to run"
        type: choice
        options: [all, team-alpha, team-bravo]
        default: all
      confirm:
        description: 'Type "destroy" to confirm a destroy'
        type: string
        required: false
        default: ""

permissions:
  id-token: write # needed for AWS OIDC login
  contents: read

# Only one Terraform run at a time - the S3 backend has no state locking yet
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: 1.5.7
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  # Empty on push / pull_request, so those always do a normal plan
  TF_ACTION: ${{ inputs.action }}
  # Per-team variable file, committed in each team folder (optional)
  TF_VAR_FILE: dev.tfvars

defaults:
  run:
    shell: bash # runs with -eo pipefail, so a failed plan isn't hidden by tee

jobs:
  plan:
    name: Plan (${{ matrix.team }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each team folder is its own stack with its own state.
        # Push / pull_request runs every team; a manual run can pick one.
        team: ${{ fromJSON(inputs.team == 'team-alpha' && '["team-alpha"]' || inputs.team == 'team-bravo' && '["team-bravo"]' || '["team-alpha","team-bravo"]') }}
    defaults:
      run:
        # Job-level defaults replace the workflow-level ones, so repeat the shell
        shell: bash
        working-directory: ${{ matrix.team }}
    steps:
      - name: Confirm destroy
        if: inputs.action == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Destroy not confirmed::To destroy, set the confirm input to exactly: destroy"
            exit 1
          fi
          echo "::warning title=Destroy requested::This run will plan the DESTRUCTION of every resource in ${{ matrix.team }}."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check AWS role secret is set
        env:
          ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing secret::AWS_PLAN_ROLE_ARN secret is not set. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          args=(-input=false -no-color -out=tfplan)
          if [ -f "$TF_VAR_FILE" ]; then
            args+=("-var-file=$TF_VAR_FILE")
          fi
          if [ "$TF_ACTION" = "destroy" ]; then
            args+=(-destroy)
          fi
          terraform plan "${args[@]}" | tee plan.txt

      - name: Add plan to job summary
        if: always()
        run: |
          {
            if [ "$TF_ACTION" = "destroy" ]; then
              echo "### :warning: Terraform DESTROY plan - ${{ matrix.team }}"
            else
              echo "### Terraform plan - ${{ matrix.team }}"
            fi
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo "No plan output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.team }}
          path: ${{ matrix.team }}/tfplan
          retention-days: 5

  apply:
    name: Apply (${{ matrix.team }})
    needs: plan
    # Runs after every merge to main, or a manual run with action apply/destroy,
    # then waits for a required reviewer to approve the "dev" environment.
    # A destroy run applies the saved destroy plan, so it deletes everything.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.action == 'apply' || inputs.action == 'destroy')))
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJSON(inputs.team == 'team-alpha' && '["team-alpha"]' || inputs.team == 'team-bravo' && '["team-bravo"]' || '["team-alpha","team-bravo"]') }}
    defaults:
      run:
        # Job-level defaults replace the workflow-level ones, so repeat the shell
        shell: bash
        working-directory: ${{ matrix.team }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check AWS role secret is set
        env:
          ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error title=Missing secret::AWS_APPLY_ROLE_ARN secret is not set. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.team }}
          path: ${{ matrix.team }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply (${{ inputs.action == 'destroy' && 'destroy' || 'apply' }})
        run: terraform apply -input=false -no-color tfplan
